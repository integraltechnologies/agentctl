[package]
name = "agentctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Provider-neutral engineering control plane protocol"
repository = "https://github.com/integraltechnologies/agentctl"
publish = false

[dependencies]
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
