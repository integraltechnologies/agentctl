[package]
name = "agentctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Provider-neutral engineering control plane protocol"
repository = "https://github.com/integraltechnologies/agentctl"
publish = false

[dependencies]
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.8"
sha2 = "0.10"
blake3 = "1.8"
ignore = "0.4"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
