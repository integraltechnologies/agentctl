version = 1
protected = []

[invariants]

[architecture]

[commands.build]
program = "cargo"
args = ["build", "--locked"]
cwd = "."

[commands.test]
program = "cargo"
args = ["test", "--locked"]
cwd = "."

[commands.fmt]
program = "cargo"
args = ["fmt", "--check"]
cwd = "."

[commands.clippy]
program = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
cwd = "."

[verification.build]
description = "Build agentctl with the locked dependency graph"
command_refs = ["build"]

[verification.test]
description = "Run the full agentctl test suite"
command_refs = ["test"]

[verification.fmt]
description = "Check Rust formatting"
command_refs = ["fmt"]

[verification.clippy]
description = "Run Clippy with warnings denied"
command_refs = ["clippy"]

[verification.full]
description = "Run the complete agentctl verification gate"
command_refs = ["build", "test", "fmt", "clippy"]
