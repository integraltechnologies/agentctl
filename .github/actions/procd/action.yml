name: procd command-line exerciser
description: >-
  Builds procd's own command-line exerciser from the procd agentctl builds
  against (the third_party/procd submodule), with procd's own CMake, into a
  runner-local directory, and exports its path as PROCD_CLI. agentctl itself
  needs none of this: its build script builds and statically links the
  library. Nothing here patches procd.

runs:
  using: composite
  steps:
    - name: build procd CLI
      shell: bash
      run: |
        set -euo pipefail
        src="$GITHUB_WORKSPACE/third_party/procd"
        build="$RUNNER_TEMP/procd-build"
        cmake -S "$src" -B "$build" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$build" --config Release --target procd-cli
        if [ "$RUNNER_OS" = Windows ]; then
          echo "PROCD_CLI=$build/Release/procd.exe" >> "$GITHUB_ENV"
        else
          echo "PROCD_CLI=$build/procd" >> "$GITHUB_ENV"
        fi
