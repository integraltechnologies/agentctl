name: procd (agentctl's external prerequisite)
description: >-
  Installs procd system-wide with agentctl's own installer
  (scripts/install.sh --deps-only), exactly as on a fresh user's machine:
  skipped if procd is already installed, otherwise procd's published release
  is built with its own CMake outside the repository and its header, static
  library and `procd` command are installed under the system prefix.
  agentctl's build then finds that installation like any user's. Nothing here
  patches procd or places it in the repository.

runs:
  using: composite
  steps:
    - name: install procd
      shell: bash
      run: |
        set -euo pipefail
        scripts/install.sh --deps-only
        # MSVC has no system-wide library path; the installer's prefix is
        # named to the build as a user would name it.
        if [ "$RUNNER_OS" = Windows ]; then
          prefix="$(cygpath -m "$PROGRAMFILES")/procd"
          echo "PROCD_INCLUDE_DIR=$prefix/include" >> "$GITHUB_ENV"
          echo "PROCD_LIB_DIR=$prefix/lib" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
        fi
