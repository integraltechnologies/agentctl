name: ci

on:
  push:
    branches: [main, "v0.3-alpha"]
  pull_request:

# Read-only token; no secrets are referenced anywhere in this workflow.
permissions:
  contents: read

# Superseded runs of the same ref are cancelled. CI keeps no external mutable
# state, so cancellation cannot corrupt anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # FORMATTING / STATIC ANALYSIS. Windows is included because cfg(windows)
  # code is otherwise never linted on the Unix runner.
  static:
    name: static (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version
          rustc --version
      # procd is an immutable external dependency: fetched from its published
      # tag (commit-pinned so a moved tag cannot change it), built with its own
      # CMake, and staged into a runner-local prefix. procd v0.1.0 has no
      # install rules, so the public header and static library are copied
      # explicitly. autocrlf is off so procd.h keeps the bytes build.rs hashes.
      - name: procd v0.1.0 (external dependency)
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/procd-src"
          prefix="$RUNNER_TEMP/procd-prefix"
          git -c core.autocrlf=false clone --quiet --depth 1 --branch v0.1.0 \
            https://github.com/integraltechnologies/procd "$src"
          test "$(git -C "$src" rev-parse HEAD)" = 2e3bb6e86156a8863dde52940f0020eb6d7d18e7
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --config Release --target procd
          mkdir -p "$prefix/include" "$prefix/lib"
          cp "$src/include/procd.h" "$prefix/include/procd.h"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$src/build/Release/procd.lib" "$prefix/lib/procd.lib"
          else
            cp "$src/build/libprocd.a" "$prefix/lib/libprocd.a"
          fi
          echo "PROCD_PREFIX=$prefix" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: static
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo check --all-targets
        run: cargo check --locked --all-targets
      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  # NATIVE TEST SUITE, per OS. Includes the orchestration recovery tests
  # (session liveness, journal withdrawal, interrupted outcomes, recovery
  # barriers, install/verifier/acceptance recovery). Some of those use bounded
  # `sleep 30` fixtures; the per-job timeout is the backstop.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, host: x86_64-unknown-linux-gnu }
          - { os: macos-15, host: aarch64-apple-darwin } # Apple Silicon
          - { os: macos-15-intel, host: x86_64-apple-darwin } # Intel
          - { os: windows-latest, host: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version
          # The runner label must actually provide the intended architecture.
          rustc -vV | tr -d '\r' | grep -Fx "host: ${{ matrix.host }}"
      # procd is an immutable external dependency: fetched from its published
      # tag (commit-pinned so a moved tag cannot change it), built with its own
      # CMake, and staged into a runner-local prefix. procd v0.1.0 has no
      # install rules, so the public header and static library are copied
      # explicitly. autocrlf is off so procd.h keeps the bytes build.rs hashes.
      - name: procd v0.1.0 (external dependency)
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/procd-src"
          prefix="$RUNNER_TEMP/procd-prefix"
          git -c core.autocrlf=false clone --quiet --depth 1 --branch v0.1.0 \
            https://github.com/integraltechnologies/procd "$src"
          test "$(git -C "$src" rev-parse HEAD)" = 2e3bb6e86156a8863dde52940f0020eb6d7d18e7
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build" --config Release --target procd
          mkdir -p "$prefix/include" "$prefix/lib"
          cp "$src/include/procd.h" "$prefix/include/procd.h"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$src/build/Release/procd.lib" "$prefix/lib/procd.lib"
          else
            cp "$src/build/libprocd.a" "$prefix/lib/libprocd.a"
          fi
          echo "PROCD_PREFIX=$prefix" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: cargo test --no-fail-fast
        run: cargo test --locked --no-fail-fast
